    font_family: TeX Gyre Heros
    font_fallbacks:
    - Helvetica
    - sans-serif
  axis_label:
    font_family: TeX Gyre Heros
    font_fallbacks:
    - Helvetica
    - sans-serif
  tick_label:
    font_family: TeX Gyre Heros
    font_fallbacks:
    - Helvetica
    - sans-serif
  caption:
    font_family: TeX Gyre Heros
    font_fallbacks:
    - Helvetica
    - sans-serif
