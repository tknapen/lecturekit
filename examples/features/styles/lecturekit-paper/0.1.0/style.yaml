schema_version: '1.0'
name: lecturekit-paper
version: 0.1.0
description: lecturekit brand 'lecturekit paper' (light) mapped onto manim8 palette
  roles; written by `lk theme --manim8`, a new version per change.
inherits: default@0.5.0
palette:
  background: '#FFFFFF'
  foreground: '#202B33'
  secondary_text: '#566573'
  muted: '#C8C3BA'
  primary_signal: '#0072B2'
  normalization_pool: '#C45A00'
  emphasis: '#175B8E'
  warning: '#A33A32'
  comparison: '#7A5195'
  neutral: '#566573'
  anchor: '#006C65'
  caveat: '#A33A32'
  concept: '#175B8E'
  context: '#7A5195'
  css: '#B63564'
  dn: '#009999'
  dog: '#B87400'
  example: '#956000'
  future: '#7A5195'
  gauss: '#175B8E'
  hairline: '#C8C3BA'
  ink: '#202B33'
  input: '#0072B2'
  paper: '#F3F2EE'
  question: '#70508C'
  slide: '#FFFFFF'
  state: '#007F73'
  update: '#C45A00'
typography:
  title:
    font_family: TeX Gyre Pagella
    font_fallbacks:
    - TeX Gyre Heros
    - TeX Gyre Heros
    - Helvetica
    - sans-serif
  body:
    font_family: TeX Gyre Heros
    font_fallbacks:
    - Helvetica
    - sans-serif
