[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "lecturekit"
version = "0.3.0"
description = "One Markdown source, a live Reveal.js deck and a Beamer study PDF: a Quarto extension, figure and clip kits, and review tools for computed lectures."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Tomas Knapen" }]
requires-python = ">=3.11"
keywords = ["quarto", "revealjs", "beamer", "lecture", "tikz", "manim"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Education",
]
dependencies = [
  "pyyaml>=6",
]

[project.optional-dependencies]
figures = ["numpy", "matplotlib", "pillow", "pymupdf>=1.24"]
review = ["playwright>=1.45", "pymupdf>=1.24", "pillow"]
clips = ["manim>=0.19,<0.23", "pillow<11.3", "imageio-ffmpeg"]
# manim8 needs Python 3.12; its contracts package is named explicitly so that pip, which ignores uv's workspace
# sources, resolves it from the same tag. manim8 builds each family's render environment with uv.
manim8 = [
  "manim8 @ git+https://github.com/tknapen/manim8@d37489eeb08df040f18201b37450514220bb7fcd ; python_version >= '3.12'",
  "manim8-core @ git+https://github.com/tknapen/manim8@d37489eeb08df040f18201b37450514220bb7fcd#subdirectory=packages/scianim_core ; python_version >= '3.12'",
]
dev = ["pytest", "pymupdf>=1.24", "playwright>=1.45", "pillow", "imageio-ffmpeg"]

[project.scripts]
lk = "lecturekit.cli:main"
lecturekit = "lecturekit.cli:main"

[project.urls]
Homepage = "https://github.com/tknapen/lecturekit"
Issues = "https://github.com/tknapen/lecturekit/issues"

[tool.hatch.metadata]
allow-direct-references = true   # the manim8 extra pins manim8's release commit until its first PyPI release

[tool.hatch.build.targets.wheel]
packages = ["src/lecturekit"]

# the Quarto extension ships inside the wheel so that `lk new` can vendor it, and the docs (each docs/*.md, a test
# checks the list) so that `lk docs` lists them where the package is installed
[tool.hatch.build.targets.wheel.force-include]
"_extensions/lecturekit" = "lecturekit/_extension"
"docs/AUTHORING.md" = "lecturekit/docs/AUTHORING.md"
"docs/CLIPS.md" = "lecturekit/docs/CLIPS.md"
"docs/FIGURES.md" = "lecturekit/docs/FIGURES.md"
"docs/INSTALL.md" = "lecturekit/docs/INSTALL.md"
"docs/LAYOUT.md" = "lecturekit/docs/LAYOUT.md"
"docs/MANIM.md" = "lecturekit/docs/MANIM.md"
"docs/POLICY.md" = "lecturekit/docs/POLICY.md"
"docs/THEMING.md" = "lecturekit/docs/THEMING.md"
"docs/WORKFLOW.md" = "lecturekit/docs/WORKFLOW.md"

[tool.hatch.build.targets.sdist]
include = ["src", "_extensions", "examples", "docs", "README.md", "LICENSE", "NOTICE.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
# the Manim kit modules import the kit and Manim with star imports, as their clips do
"src/lecturekit/manim/*" = ["F403", "F405"]
"src/lecturekit/scaffold/templates/*" = ["F403", "F405"]
