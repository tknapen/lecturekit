name: build

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# one run per branch at a time; a newer push to a work branch replaces its running build
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        preset: [paper, dark]
    steps:
      - uses: actions/checkout@v4

      - name: Install Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.11.9
          tinytex: true

      - name: TeX packages
        run: |
          # Quarto's TinyTeX is not on PATH by itself: put its bin directory there, for this step and the next.
          TT="$(dirname "$(find "$HOME/.TinyTeX" "$HOME/bin" -name tlmgr 2>/dev/null | head -1)" 2>/dev/null)"
          [ -n "$TT" ] && [ "$TT" != . ] && { export PATH="$TT:$PATH"; echo "$TT" >> "$GITHUB_PATH"; }
          tlmgr install beamer adjustbox collectbox etoolbox ragged2e pgf xcolor standalone fontspec unicode-math \
            textcase lm lm-math varwidth caption booktabs || true
          sudo apt-get update && sudo apt-get install -y --no-install-recommends lmodern fonts-lmodern
          fc-cache -f

      - uses: astral-sh/setup-uv@v5
      - name: Python environment
        run: |
          uv venv .venv
          uv pip install -p .venv/bin/python -e ".[dev]"
          .venv/bin/playwright install --with-deps chromium

      - name: Build the example decks
        run: |
          source .venv/bin/activate
          for d in kickoff features; do ln -sfn ../../_extensions examples/$d/_extensions; done
          if [ "${{ matrix.preset }}" = "dark" ]; then
            lk build examples/kickoff --profile dark --strict
            lk build examples/features --profile dark --strict
          else
            lk build examples/kickoff --strict
            lk build examples/features --strict
          fi

      - name: Checks
        shell: bash
        run: |
          source .venv/bin/activate
          OUT=_build; BRAND=_brand.yml; MODE=light
          if [ "${{ matrix.preset }}" = "dark" ]; then OUT=_build-dark; BRAND=_brand-dark.yml; MODE=dark; fi
          mkdir -p report/${{ matrix.preset }}
          for d in kickoff features; do
            lk review contrast examples/$d/$BRAND --mode $MODE
            lk review shoot examples/$d/$OUT/slides-live.html --out review/${{ matrix.preset }}/$d --sheet
            lk review measure examples/$d/$OUT/slides-live.html
            lk review overflow examples/$d || true   # informational: the study PDF's overfull frames, by title
          done 2>&1 | tee report/${{ matrix.preset }}/checks.log

      - name: Tests
        if: matrix.preset == 'paper'
        run: |
          source .venv/bin/activate
          mkdir -p report/paper
          pytest -q --junitxml=report/paper/pytest.xml

      # this preset's part of the CI results page (.github/scripts/ci_site.py), uploaded whether or not a step failed
      - name: Collect the site part
        if: always()
        shell: bash
        run: |
          P=${{ matrix.preset }}; OUT=_build; [ "$P" = dark ] && OUT=_build-dark
          mkdir -p part/$P
          for d in kickoff features; do
            [ -d examples/$d/$OUT ] && cp -r examples/$d/$OUT part/$P/$d
          done
          [ -d review/$P ] && cp -r review/$P part/$P/review
          [ -d report/$P ] && cp -r report/$P part/$P/report
          true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: site-${{ matrix.preset }}
          path: part

  # The seam with manim8, run for real: lecturekit installed from this repository with the manim8 extra (so manim8
  # comes from the tag the extra names, with pip alone: manim8 brings uv), the feature deck's manim8 clip rendered
  # afresh in both presets, its index checked against the manifest of the job, the deck built and its fragments
  # checked, and the seam tests.
  seam:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.11.9
          tinytex: true

      - name: TeX packages and the libraries Manim builds against
        run: |
          # Quarto's TinyTeX is not on PATH by itself: put its bin directory there, for this step and the next.
          TT="$(dirname "$(find "$HOME/.TinyTeX" "$HOME/bin" -name tlmgr 2>/dev/null | head -1)" 2>/dev/null)"
          [ -n "$TT" ] && [ "$TT" != . ] && { export PATH="$TT:$PATH"; echo "$TT" >> "$GITHUB_PATH"; }
          tlmgr install beamer adjustbox collectbox etoolbox ragged2e pgf xcolor standalone fontspec unicode-math \
            textcase lm lm-math varwidth caption booktabs || true
          sudo apt-get update && sudo apt-get install -y --no-install-recommends lmodern fonts-lmodern \
            libcairo2-dev libpango1.0-dev pkg-config ffmpeg
          fc-cache -f

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python environment (pip, from the repository)
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install ".[dev,clips,manim8]"
          .venv/bin/playwright install --with-deps chromium
          .venv/bin/lk version
          .venv/bin/scianim --help > /dev/null

      - name: Render the feature deck's manim8 clip, both presets
        run: |
          source .venv/bin/activate
          lk clips examples/features --only tuning_sweep --no-cache
          lk clips examples/features --only tuning_sweep --no-cache --mode dark

      - name: The index against the manifest
        shell: bash
        run: |
          source .venv/bin/activate
          mkdir -p report/seam
          python .github/scripts/check_clip_index.py examples/features tuning_sweep 2>&1 | tee report/seam/index-check.log
          python .github/scripts/check_clip_index.py examples/features tuning_sweep --mode dark 2>&1 \
            | tee report/seam/index-check-dark.log

      - name: Build the feature deck with the fresh clip, both presets
        run: |
          source .venv/bin/activate
          lk build examples/features
          lk build examples/features --profile dark
          lk review frags examples/features/_build/slides-live.html --out review/seam/frags
          lk review frags examples/features/_build-dark/slides-live.html --out review/seam/frags-dark

      - name: Seam tests
        run: |
          source .venv/bin/activate
          mkdir -p report/seam
          pytest -q tests/test_seam.py --junitxml=report/seam/pytest.xml

      - name: Collect the site part
        if: always()
        shell: bash
        run: |
          mkdir -p part/seam/report/manifests
          [ -d examples/features/_build ] && cp -r examples/features/_build part/seam/features
          [ -d examples/features/_build-dark ] && cp -r examples/features/_build-dark part/seam/features-dark
          [ -d examples/features/assets/clips ] && cp -r examples/features/assets/clips part/seam/clips
          [ -d review/seam/frags ] && cp -r review/seam/frags part/seam/frags
          [ -d review/seam/frags-dark ] && cp -r review/seam/frags-dark part/seam/frags-dark
          [ -d report/seam ] && cp -r report/seam/. part/seam/report/
          for m in examples/features/clips/families/*/*/renders/*/*/manifest.json; do
            [ -f "$m" ] && cp "$m" "part/seam/report/manifests/$(basename "$(dirname "$m")").json"
          done
          true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: site-seam
          path: part

  # The CI results page: every job's part side by side, with an index (.github/scripts/ci_site.py). It is built for
  # every run (the artifact 'site') and published to GitHub Pages from main, also when a job failed, so the page
  # shows the failure.
  site:
    if: always()
    needs: [build, seam]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: site-*
          merge-multiple: true
          path: site
      - name: Assemble the page
        env:
          RESULTS: ${{ toJSON(needs) }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          SHA: ${{ github.sha }}
          REF: ${{ github.ref_name }}
        run: python3 .github/scripts/ci_site.py site
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: site
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: site

  deploy:
    if: always() && github.ref == 'refs/heads/main' && needs.site.result == 'success'
    needs: site
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
