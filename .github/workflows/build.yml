name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        preset: [paper, dark]
    steps:
      - uses: actions/checkout@v4

      - name: Install Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.11.9
          tinytex: true

      - name: TeX packages
        run: |
          tlmgr install beamer adjustbox collectbox etoolbox ragged2e pgf xcolor standalone fontspec unicode-math \
            textcase lm lm-math varwidth caption booktabs || true
          sudo apt-get update && sudo apt-get install -y --no-install-recommends lmodern fonts-lmodern
          fc-cache -f

      - uses: astral-sh/setup-uv@v5
      - name: Python environment
        run: |
          uv venv .venv
          uv pip install -p .venv/bin/python -e ".[dev]"
          .venv/bin/playwright install --with-deps chromium

      - name: Build the example decks
        run: |
          source .venv/bin/activate
          for d in kickoff features; do ln -sfn ../../_extensions examples/$d/_extensions; done
          if [ "${{ matrix.preset }}" = "dark" ]; then
            lk build examples/kickoff --profile dark
            lk build examples/features --profile dark
          else
            lk build examples/kickoff
            lk build examples/features
          fi

      - name: Checks
        run: |
          source .venv/bin/activate
          OUT=_build; BRAND=_brand.yml; MODE=light
          if [ "${{ matrix.preset }}" = "dark" ]; then OUT=_build-dark; BRAND=_brand-dark.yml; MODE=dark; fi
          for d in kickoff features; do
            lk review contrast examples/$d/$BRAND --mode $MODE
            lk review shoot examples/$d/$OUT/slides-live.html --out review/${{ matrix.preset }}/$d --sheet
            lk review measure examples/$d/$OUT/slides-live.html
            lk review overflow examples/$d || true
          done

      - name: Tests
        if: matrix.preset == 'paper'
        run: |
          source .venv/bin/activate
          pytest -q

      - uses: actions/upload-artifact@v4
        with:
          name: decks-${{ matrix.preset }}
          path: |
            examples/*/_build*/slides-live.html
            examples/*/_build*/slides-study.pdf
            review/${{ matrix.preset }}

      - name: Assemble the Pages site
        if: matrix.preset == 'paper'
        run: |
          mkdir -p site/kickoff site/features
          cp -r examples/kickoff/_build/. site/kickoff/
          cp -r examples/features/_build/. site/features/
          cp -r review/paper site/review
          cat > site/index.html <<'EOF'
          <!doctype html><meta charset="utf-8"><title>lecturekit</title>
          <h1>lecturekit</h1>
          <p>The worked example: <a href="kickoff/slides-live.html">live deck</a> ·
             <a href="kickoff/slides-study.pdf">study PDF</a> · <a href="review/kickoff/sheet.png">contact sheet</a></p>
          <p>The feature deck: <a href="features/slides-live.html">live deck</a> ·
             <a href="features/slides-study.pdf">study PDF</a> · <a href="review/features/sheet.png">contact sheet</a></p>
          EOF
      - uses: actions/upload-pages-artifact@v3
        if: matrix.preset == 'paper'
        with:
          path: site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
